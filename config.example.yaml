# =====================================================================================
#  Knowledge RAG - configuration
#
#  1. Copy this file to config.yaml (config.yaml is what the scripts read).
#  2. Pick a chat model under `llm` and an embedding model under `embeddings`.
#  3. Paste the API keys you need under `providers`, or leave them blank and set the environment
#     variables instead (OPENAI_API_KEY, ANTHROPIC_API_KEY, GEMINI_API_KEY, XAI_API_KEY).
#
#  config.yaml is listed in .gitignore so pasted keys are never committed;
#  config.example.yaml is the tracked copy without secrets.
# =====================================================================================

llm:
  provider: openai          # openai | anthropic | gemini | grok | ollama
  temperature: 0.2          # low = factual, repeatable answers (models that fix it, e.g. Claude 5.x, ignore this)
  max_tokens: 8192          # cap on the answer length (includes "thinking" tokens on reasoning models)

embeddings:
  # The embedding model turns text into vectors for similarity search. It must stay the SAME between
  # `python ingest.py` and `python chat.py`: the index remembers which one built it and refuses to mix.
  # anthropic and grok do not offer embedding models - pair them with openai, gemini, ollama or builtin.
  provider: ollama          # openai | gemini | ollama | local | builtin
  batch_size: 64            # texts per embedding request

providers:
  openai:
    api_key: ""                                     # <-- paste your OpenAI key here, or set OPENAI_API_KEY
    model: gpt-5.6-luna                             # fast and cheap; stronger: gpt-6.1-sol; flagship: gpt-6-astra
    embedding_model: text-embedding-3-small         # 1536 dims (text-embedding-3-large = 3072 dims)
    embedding_dimensions: null                      # optional: shrink vectors, e.g. 512, to save space

  anthropic:
    api_key: ""                                     # <-- paste your Anthropic key here, or set ANTHROPIC_API_KEY
    model: claude-opus-5-5                          # alternatives: claude-sonnet-5-5 (cheaper), claude-haiku-5-5 (fastest)
    effort: low                                     # thinking depth: low | medium | high | xhigh | max (low = quickest)
    refusal_fallbacks: true                         # re-run on a fallback model if a safety classifier declines

  gemini:
    api_key: ""                                     # <-- paste your Google AI Studio key here, or set GEMINI_API_KEY
    model: gemini-3.8-flash                         # fast general model; flagship: gemini-4-argon; cheapest: gemini-3.5-flash-lite
    embedding_model: gemini-embedding-001           # text embedding model (3072 dims by default)
    embedding_dimensions: 768                       # 768 / 1536 / 3072 are the recommended sizes

  grok:
    api_key: ""                                     # <-- paste your xAI key here, or set XAI_API_KEY
    model: grok-4.7                                 # flagship; cheaper: grok-4.3
    base_url: https://api.x.ai/v1                   # xAI speaks the OpenAI chat-completions protocol

  ollama:                                           # local models: no key, no network (https://ollama.com)
    base_url: http://localhost:11434
    model: llama3.2                                 # ollama pull llama3.2      (others: qwen2.5, llama3.1:8b, gemma3)
    embedding_model: nomic-embed-text               # ollama pull nomic-embed-text   (768 dims; or mxbai-embed-large)
    num_ctx: 8192                                   # context window to request; keep above retrieval.max_context_chars / 4

  local:                                            # sentence-transformers in-process (pip install sentence-transformers)
    embedding_model: sentence-transformers/all-MiniLM-L6-v2   # 384 dims, ~90 MB download on first use

  builtin: {}                                       # zero-dependency hashed n-gram vectors: offline tests only, not semantic

paths:
  knowledge_dir: knowledge  # drop your documents here (.txt .md .pdf .docx .csv .html .json; sub-folders are fine)
  index_dir: index          # generated by ingest.py (chunks.jsonl, vectors.npy, manifest.json)

ingestion:
  chunk_size: 800           # characters per chunk (~200 tokens); smaller = more precise hits, less context each
  chunk_overlap: 150        # characters shared by neighbouring chunks so a fact split across a cut survives
  include_extensions: [".txt", ".md", ".pdf", ".docx", ".csv", ".html", ".json"]

retrieval:
  top_k: 5                  # passages handed to the LLM
  hybrid: true              # dense (embeddings) + sparse (BM25 keywords), merged with Reciprocal Rank Fusion
  candidates: 20            # how many each search contributes before fusion
  rrf_k: 60                 # RRF constant (60 = the value from the paper; higher flattens rank differences)
  min_score: 0.0            # drop dense hits with cosine similarity below this (0 = keep all)
  max_context_chars: 12000  # budget for all passages in the prompt (~3,000 tokens)

chat:
  max_history_turns: 6      # question/answer pairs remembered (context passages are never stored in history)
  rewrite_followups: true   # turn "and for P2?" into a standalone search query using the conversation
  stream: true              # print the answer as it is generated
  show_sources: true        # list the cited passages after each answer
